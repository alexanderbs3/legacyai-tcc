services:
  postgres:
    image: postgres:16-alpine
    container_name: legacyai-postgres
    environment:
      POSTGRES_DB: legacyai
      POSTGRES_USER: legacyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacyai -d legacyai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: