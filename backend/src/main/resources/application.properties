spring.application.name=legacyai

spring.datasource.url=jdbc:postgresql://localhost:5433/legacyai
spring.datasource.username=legacyai
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway gerencia o schema do banco.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5433/legacyai
spring.flyway.user=legacyai
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:}

server.port=${SERVER_PORT:8080}

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.servlet.multipart.max-file-size=70MB
spring.servlet.multipart.max-request-size=75MB
upload.temp-dir=${user.home}/.legacyai/uploads

ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.model=deepseek-flash
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=claude-haiku-4-5
ai.timeout.connect-seconds=10
ai.timeout.read-seconds=90
